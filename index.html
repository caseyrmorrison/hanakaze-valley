<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hanakaze Valley</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="world"></canvas>

  <div id="title-card">
    <h1>花風の谷</h1>
    <p class="sub">Hanakaze Valley</p>
    <button id="enter">Enter the valley</button>
    <p class="hint">WASD to walk · mouse or drag to look · Shift to run · Space to jump<br />T cycles time of day · M mutes sound · Esc releases the mouse<br />Touch: left thumb walks, right thumb looks</p>
  </div>

  <button id="sound" type="button" hidden aria-label="Turn sound off" title="Sound (M)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="spk" d="M4 9h4l5-4v14l-5-4H4z" />
      <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
      <path class="slash" d="M16 9l5 6M21 9l-5 6" />
    </svg>
  </button>

  <div id="hud" hidden>
    <span id="clock">Golden hour</span>
    <span id="place"></span>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
