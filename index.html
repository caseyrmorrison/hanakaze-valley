<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hanakaze Valley</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // If the game can't start, say why on screen instead of leaving a blank page.
    (function () {
      function show(message) {
        var el = document.getElementById("load-error");
        if (!el) {
          document.addEventListener("DOMContentLoaded", function () { show(message); });
          return;
        }
        if (!el.hidden) return;
        el.textContent = message;
        el.hidden = false;
      }
      window.showLoadError = show;
      window.addEventListener("error", function (e) {
        var t = e.target;
        var src = t && t !== window && (t.src || t.href);
        if (!src) {
          show("The game hit an error while starting: " + e.message);
        } else if (/src\/main\.js/.test(src)) {
          // The game module fails as a whole when a dependency can't load; check the 3D engine's CDN.
          fetch("https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", { mode: "no-cors" })
            .then(function () { show("Part of the game failed to load. Reload the page to try again."); })
            .catch(function () {
              show("The game's 3D engine couldn't be downloaded from cdn.jsdelivr.net. If you use a content blocker or you're offline, allow that site and reload.");
            });
        } else {
          show("The game couldn't load " + src + ".");
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        show("The game hit an error while starting: " + ((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (!window.valleyStarted) {
          show("The game is taking too long to start. If you use a content blocker, allow cdn.jsdelivr.net, which serves the 3D engine, then reload.");
        }
      }, 15000);
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="world"></canvas>
  <p id="load-error" role="alert" hidden></p>

  <div id="title-card">
    <h1>花風の谷</h1>
    <p class="sub">Hanakaze Valley</p>
    <button id="enter">Enter the valley</button>
    <p class="hint">WASD to walk · mouse or drag to look · Shift to run · Space to jump<br />E talks to people · T cycles time of day · P photo mode · M mutes sound · Esc releases the mouse<br />Touch: left thumb walks, right thumb looks</p>
  </div>

  <button id="sound" type="button" hidden aria-label="Turn sound off" title="Sound (M)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="spk" d="M4 9h4l5-4v14l-5-4H4z" />
      <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
      <path class="slash" d="M16 9l5 6M21 9l-5 6" />
    </svg>
  </button>

  <button id="talk" type="button" hidden><kbd>E</kbd><span>Talk</span></button>

  <div id="dialogue" hidden aria-live="polite">
    <div class="tag"><strong id="dialogue-name"></strong><span id="dialogue-role"></span></div>
    <p id="dialogue-text"></p>
    <span class="more" aria-hidden="true">▼</span>
  </div>

  <div id="hud" hidden>
    <span id="clock">Golden hour</span>
    <span id="place"></span>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
